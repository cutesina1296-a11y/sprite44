services:
  - type: web
    name: nova
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: BANK_DETAILS_ENCRYPTION_KEY
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENT_PROVIDER
        value: watchpays
      - key: WATCHPAYS_MERCHANT_ID
        sync: false
      - key: WATCHPAYS_API_KEY
        sync: false
      - key: WATCHPAYS_PAYIN_URL
        value: https://api.watchpays.com/v1/create
      - key: WATCHPAYS_PAYIN_CALLBACK_URL
        value: https://sprite44.onrender.com/api/recharge/watchpays/callback
